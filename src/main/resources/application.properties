# Servidor
server.port=8080

# Banco de dados H2 (arquivo local, nao precisa instalar nada)
spring.datasource.url=jdbc:h2:file:./data/plataformavagas;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Console do H2 (acessivel em /h2-console para inspecionar o banco)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Nome da aplicacao
spring.application.name=plataforma-vagas

# Login do painel administrativo (troque a senha antes de usar em producao!)
spring.security.user.name=admin
spring.security.user.password=monteVagas

